[package]
name = "hybrid-edr-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Async runtime ---
tokio = { version = "1.34", features = ["full"] }

# --- Filesystem watching ---
# notify uses inotify/fanotify backend on Linux; wrapped in async channel
notify = "6.1.1"

# --- HTTP client (outbound to backend API) ---
reqwest = { version = "0.11", features = ["json", "multipart"] }

# --- Serialization ---
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Cryptography ---
sha2 = "0.10"
hex  = "0.4"

# --- Logging ---
log        = "0.4"
env_logger = "0.10"

# --- eBPF kernel sensor ---
aya     = { version = "0.12", features = ["async_tokio"] }
aya-log = "0.2"
bytes   = "1.5"

# --- YARA signature matching (scanner::yara_engine) ---
# `yara` crate provides safe Rust bindings over libyara.
# Build requires libyara-dev on the host (apt install libyara-dev / dnf install yara-devel).
yara = "0.16"

# --- Error handling (rust-daemon-skill) ---
# thiserror: structured error types in library code
# anyhow:    only at binary top level (main.rs)
thiserror = "1.0"
anyhow    = "1.0"

# --- Quarantine metadata sidecar serialisation ---
# serde_json already listed above — used for QuarantineMeta JSON output

# --- Cross-device rename detection ---
# libc provides EXDEV constant for detecting cross-filesystem renames
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Optimize for size in the daemon binary to reduce attack surface
opt-level = "s"
strip     = true
