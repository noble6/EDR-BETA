# alembic.ini — Alembic migration configuration for EDR-BETA backend
#
# Usage:
#   cd backend/
#   DATABASE_URL=<your_url> alembic upgrade head
#   DATABASE_URL=<your_url> alembic downgrade -1
#   DATABASE_URL=<your_url> alembic revision --autogenerate -m "description"
#
# Note: DATABASE_URL must use the postgresql+asyncpg:// scheme at runtime
# but the env.py migration runner converts it to psycopg2 for Alembic.
# Never store actual credentials in this file.

[alembic]
script_location = migrations
prepend_sys_path = .

# Alembic will use DATABASE_URL from the environment (env.py)
sqlalchemy.url = 

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
